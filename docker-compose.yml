name: stockpile

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockpile}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockpile}
      POSTGRES_DB: ${POSTGRES_DB:-stockpile}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  db-setup:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: db-setup
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-stockpile}:${POSTGRES_PASSWORD:-stockpile}@postgres:5432/${POSTGRES_DB:-stockpile}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@stockpile.local}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-stockpile}:${POSTGRES_PASSWORD:-stockpile}@postgres:5432/${POSTGRES_DB:-stockpile}
      REDIS_URL: redis://redis:6379
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      EXCHANGE_CURRENCIES: ${EXCHANGE_CURRENCIES:-EUR,GBP,JPY,CNY,CAD,BRL,COP}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-3600}
      EXCHANGE_RATES_TIMEOUT_MS: ${EXCHANGE_RATES_TIMEOUT_MS:-2000}
      UPLOAD_DIR: /app/apps/api/uploads
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-104857600}
      IMPORT_JOB_ATTEMPTS: ${IMPORT_JOB_ATTEMPTS:-3}
      IMPORT_JOB_BACKOFF_MS: ${IMPORT_JOB_BACKOFF_MS:-1000}
      THROTTLE_LOGIN_LIMIT: ${THROTTLE_LOGIN_LIMIT:-5}
      THROTTLE_LOGIN_TTL_MS: ${THROTTLE_LOGIN_TTL_MS:-60000}
      THROTTLE_ACCESS_REQUEST_LIMIT: ${THROTTLE_ACCESS_REQUEST_LIMIT:-3}
      THROTTLE_ACCESS_REQUEST_TTL_MS: ${THROTTLE_ACCESS_REQUEST_TTL_MS:-3600000}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - uploads:/app/apps/api/uploads
    depends_on:
      db-setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-stockpile}:${POSTGRES_PASSWORD:-stockpile}@postgres:5432/${POSTGRES_DB:-stockpile}
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      EXCHANGE_CURRENCIES: ${EXCHANGE_CURRENCIES:-EUR,GBP,JPY,CNY,CAD,BRL,COP}
      JWT_SECRET: ${JWT_SECRET:-}
      UPLOAD_DIR: /app/apps/api/uploads
      IMPORT_CONCURRENCY: ${IMPORT_CONCURRENCY:-2}
      IMPORT_JOB_ATTEMPTS: ${IMPORT_JOB_ATTEMPTS:-3}
      IMPORT_JOB_BACKOFF_MS: ${IMPORT_JOB_BACKOFF_MS:-1000}
      IMPORT_RECONCILE_INTERVAL_MS: ${IMPORT_RECONCILE_INTERVAL_MS:-30000}
      IMPORT_RECONCILE_AFTER_MS: ${IMPORT_RECONCILE_AFTER_MS:-60000}
    volumes:
      - uploads:/app/apps/api/uploads
    depends_on:
      db-setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
  uploads:
